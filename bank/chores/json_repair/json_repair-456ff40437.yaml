instruction: 'In src/json_repair/parse_object.py, an object inside an array is sometimes closed twice,
  as in ''[{"key":"value"}},{"key":"value"}]''. At the end of parse_object, where it returns early because
  the context is not empty, first check whether the current character is "}" and self.context.current
  is neither ContextValues.OBJECT_KEY nor ContextValues.OBJECT_VALUE; if so, log that an extra closing
  brace is being skipped and move past it. That input should repair to ''[{"key": "value"}, {"key": "value"}]''.'
