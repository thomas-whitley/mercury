instruction: 'In src/json_repair/parse_array.py, an array that is an object''s value and lost its closing
  bracket swallows the next member, as in ''{"outer": ["a", "b", "next": "value"}''. In parse_array, note
  on entry whether self.context.current is ContextValues.OBJECT_VALUE. Where a string item turns out to
  be followed by a colon, if the array is such a value and every item so far is a scalar (no dict or list),
  log "Closed unclosed array before object member after scalar items" and stop the array there, and in
  that case do not step past a closing delimiter at the end. That input then gives {"outer": ["a", "b"],
  "next": "value"}, with or without strict=True.'
