library: json_repair
repo: thomas-whitley/json_repair
instruction: 'In src/json_repair/parse_number.py, when parse_number finds a letter right after the digits
  it rolls back with self.index -= len(number_str) and parses a string instead. Because underscores are
  skipped and never added to number_str, the rollback lands in the wrong place for input such as 123_456ABC.
  Record the index where the number started at the top of parse_number and roll back to exactly that index.
  Then repair_json(''{"sku": 123_456ABC}'', return_objects=True) gives {"sku": "123_456ABC"}, "[1_2_3ABC]"
  gives ["1_2_3ABC"], and 123_456 is still the number 123456.'
