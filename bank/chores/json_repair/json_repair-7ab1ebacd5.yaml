instruction: 'Python style tuples are parsed as arrays, but a tuple of booleans or None fails, such as
  "(True, False, None)" or ''{"coords": (True, None)}''. Two changes. In src/json_repair/parse_string_helpers/parse_boolean_or_null.py,
  parse_boolean_or_null(parser) must accept a closing parenthesis ")" after a literal, as it accepts a
  comma, "]", "}" or whitespace. In src/json_repair/parser_parenthesized.py, top_level_parenthesized_can_start_value(parser)
  must compare the text inside the parenthesis case insensitively, and accept "none" as well as "true",
  "null" and "false". With return_objects=True and skip_json_loads=True, "(True, False, None)" gives [True,
  False, None].'
