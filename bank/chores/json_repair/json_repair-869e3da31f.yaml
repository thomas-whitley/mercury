repo: thomas-whitley/json_repair
instruction: 'In src/json_repair/json_parser.py, JSONParser.skip_to_character(character, idx) returns
  the offset of the next matching character, but it treats an escaped occurrence (one preceded by a backslash)
  as a real delimiter, which breaks strings that contain escaped quotes. When the character found is preceded
  by a backslash, keep searching after it, so skip_to_character returns the first unescaped match. For
  example, the input {''key'': "{\"key\": 1, \"key2\": 1}"} must keep the inner escaped quotes, and repair_json
  returns {"key": "{\"key\": 1, \"key2\": 1}"}.'
