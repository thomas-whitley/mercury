instruction: 'In src/json_repair/parse_string_helpers/object_value_context.py, classify_object_value_comma(parser)
  decides what a comma inside an object value starts. Prose with a bracketed comma group followed by a
  LaTeX command is wrongly split, as in the input { "key": "x [0,2] f(-\\frac{3}{4})" }. Return "container"
  straight away when the character right after the comma (next_c) is "{" or "[". Later, where an opening
  brace or bracket is found before the next quote, return "string" instead of "container". With return_objects=True
  and skip_json_loads=True that input keeps its value whole, a Python string of x [0,2] f(-\frac{3}{4}).'
