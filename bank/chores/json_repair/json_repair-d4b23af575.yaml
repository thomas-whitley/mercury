instruction: 'In src/json_repair/parse_object.py, when an object inside an array is missing its closing
  brace and the next character is the array''s closing bracket, parse_object repairs it wrongly. In the
  loop over members, after skipping a comma or quote, if the current character is "]" and ContextValues.ARRAY
  is in self.context.context, log that the object is being closed at the array bracket, step the index
  back by one and break, so the object ends there and the array can close. For example repair_json(''{"array":[{"key":
  "value"], "key2": "value2"}'') gives ''{"array": [{"key": "value"}], "key2": "value2"}''.'
