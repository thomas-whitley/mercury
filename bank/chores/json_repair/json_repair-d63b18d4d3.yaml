id: json_repair-d63b18d4d3
library: json_repair
repo: thomas-whitley/json_repair
instruction: 'In src/json_repair/parse_number.py, parse_number drops a positive exponent, so 1e+10 is
  not read as 1e10. In its loop, also accept "+" when number_str so far ends with "e" or "E", and add
  "+" to the characters that are rolled back when the number ends on one (now "+-eE/,"). A plus anywhere
  else still ends the number, so "[1+2]" gives [1, 2], and "[1e+]" repairs the same way as "[1e-]". This
  must hold for repair_json and for load(StringIO(...), chunk_length=2), with skip_json_loads True or
  False: ''{"value": -2.5E+3'' gives {"value": -2500.0}.'
