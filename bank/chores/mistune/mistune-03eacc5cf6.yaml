id: mistune-03eacc5cf6
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/list_parser.py, _compile_list_break_sc(block, leading_width) relaxes each
  break rule's indent bound by replacing the first "3" in the pattern, which for a fenced directive's
  marker run "{3,}" turns it into "{1,}", so inside a "- " list item a single ":" before "{note}" opens
  a directive. Replace the first " {0,3}" in each pattern with " {0,N}" for the item's leading width N
  instead, leaving patterns without that bound untouched. A real ":::{note}" directive must still end
  a list.
