id: mistune-0d6f3d8502
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/renderers/html.py, HTMLRenderer.image(text, url, title) builds the alt attribute
  with escape_text(striptags(text)), but text has already been HTML escaped by the rendering pipeline,
  so an ampersand in the alt text comes out as &amp;amp;. Use striptags(text) alone for alt. Then mistune.html("![dogs
  & cats](dogs.png)") gives '<p><img src="dogs.png" alt="dogs &amp; cats" /></p>', and a quote in the
  alt text comes out once as &quot;.
