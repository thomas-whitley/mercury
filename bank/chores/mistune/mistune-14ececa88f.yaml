id: mistune-14ececa88f
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/renderers/markdown.py, MarkdownRenderer.heading always writes an ATX heading
  ("# ..."), so a setext heading that spans several lines loses every line after the first on a re-parse.
  When the rendered text contains a newline and the level is 1 or 2, write the text followed by a line
  of "===" for level 1 or "---" for level 2, then a blank line. Otherwise write the ATX heading as before.
