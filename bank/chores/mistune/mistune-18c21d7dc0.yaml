id: mistune-18c21d7dc0
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/directives/include.py, the Include directive reads a Markdown file and parses
  it, but a file with Windows ("\r\n") or old Mac ("\r") line endings is not parsed as the same lines,
  so the directive inside it, and the check that refuses a file including itself in a loop, do not work.
  Before making the child state for an included .md, .markdown or .mkd file, replace "\r\n" and then "\r"
  in its content with "\n".
