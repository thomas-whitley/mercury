id: mistune-2841c333ba
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/renderers/markdown.py, MarkdownRenderer drops backslash escapes, so text such
  as "\* literal" or "\# text" comes back as a list item or a heading when the output is parsed again.
  Add a module regex _block_prefix_re for a leading block marker (optional whitespace, then ">", one of
  "-", "+", "*", one to six "#", or one to nine digits followed by "." or ")", then whitespace or the
  end of the line) and a helper _escape_block_prefix(text) that, on every line of text, puts a backslash
  before the last character of such a marker. Apply it in paragraph() and block_text() to the rendered
  children. In text(), escape every backtick in the raw text as "\`". Real list, heading and quote syntax
  still renders through its own tokens, and ordinary prose such as snake_case, "use - dashes" or "C# and
  1.5" is unchanged.
