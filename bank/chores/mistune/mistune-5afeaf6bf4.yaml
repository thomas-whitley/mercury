library: mistune
repo: thomas-whitley/mistune
instruction: 'In src/mistune/directives/image.py, render_block_image renders the image directive''s src
  with escape_text(src), while the inline image renderer passes its URL through safe_url. So ".. image::
  javascript:alert" produces an img whose src is the harmful URL. Render the src with self.safe_url(src)
  instead, which escapes a safe URL exactly as before and turns a harmful scheme into "#harmful-link",
  so that directive gives src="#harmful-link" and the javascript: text no longer appears in the HTML.'
