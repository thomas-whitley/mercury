id: mistune-85701ee64d
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/helpers.py, parse_link_href skips the character after any backslash in a bare
  link destination, so in "[a](foo\ bar)" the space is hidden from the check that ends the destination
  and the link gets an illegal href. Treat a backslash as an escape only when the next character is ASCII
  punctuation (string.punctuation), as unescape_char does. That input is then rendered as the literal
  text "[a](foo\ bar)" in a paragraph, while "[a](foo\*bar)" still links to foo*bar.
