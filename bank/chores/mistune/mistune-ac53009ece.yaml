instruction: 'In src/mistune/toc.py, render_toc_ul(toc) returns an empty string for an empty list, but
  for an empty iterable that is not a list, such as a filter object that yields nothing, it returns a
  dangling ''<ul>\n'' plus closing tags. Build the items without the opening ''<ul>\n'' and, at the end,
  return '''' when no item was rendered; otherwise wrap the result as before, ''<ul>\n'' + items + ''</li>\n</ul>\n''.
  So render_toc_ul(filter(lambda _: False, [])) returns ''''.'
