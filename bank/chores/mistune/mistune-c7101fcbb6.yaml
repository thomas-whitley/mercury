instruction: In src/mistune/renderers/html.py, HTMLRenderer.safe_url compares the lowercased URL with
  HARMFUL_PROTOCOLS, so a percent encoded scheme such as "javascript%3Aalert(1)", or one encoded twice
  ("javascript%253A..."), gets through. Add "feed:", "jar:", "livescript:", "mocha:", "ms-its:", "mk:",
  "res:" and "view-source:" to HARMFUL_PROTOCOLS, and add a module function _unquote_url(url) that applies
  urllib.parse.unquote up to three times, stopping when nothing changes. In safe_url, compare _unquote_url(url).lower()
  instead of url.lower(), for both the allowed protocols and the harmful ones; the URL that is returned
  is still escape_text(url) of the original. A percent encoded data:image URL stays allowed.
