id: mistune-cff35d57e8
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/renderers/markdown.py, MarkdownRenderer.block_quote indents the rendered children
  with "> " and then calls rstrip("> \n"), which also strips a ">" that ends the quote's own content,
  so "> <https://example.com>" loses its closing bracket. Instead strip only the trailing newlines from
  the rendered children, then indent every line with "> ", and return that followed by "\n\n".
