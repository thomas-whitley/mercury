id: mistune-e12f0d38d0
library: mistune
repo: thomas-whitley/mistune
instruction: In src/mistune/helpers.py, _parse_angle_link_href(src, pos) refuses a backslash inside an
  angle bracket link destination, so "[link](<foo\*bar>)" is left as literal text. When it meets a backslash,
  step over it and the next character together (not past the end of src) and keep scanning; an unescaped
  "<", a line ending or a NUL still ends the scan with no link. That link then renders as '<a href="foo*bar">link</a>',
  and the same holds for a reference definition.
