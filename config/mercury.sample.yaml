# Sample Mercury config. The public image reads one file like this, mounted at
# /config/mercury.yaml. Copy it into a private repo, fill in the values, and never
# put a secret here: secrets come from the environment (see the list at the bottom).

telegram:
  chat_id: 0            # the one chat the bot answers; everyone else gets silence
  timezone: Australia/Melbourne

tasks:                  # optional; each type's ladder is the providers it tries in order
  pytest:
    ladder: [gemini, ollama]
    budget_tokens: 50000
  chat:
    ladder: [ollama, gemini]
    budget_tokens: 20000
  repo_chore:
    ladder: [gemini, ollama]
    budget_tokens: 50000
  digest:
    ladder: [gemini, ollama]
    budget_tokens: 20000
# Token and dollar caps are environment variables, not this file:
# DAILY_TOKENS_PER_PROVIDER (500000) and MONTHLY_BUDGET_USD (5).

portfolio:
  repos:                # a repo_chore may touch only these, and only one with a test_command
    - name: owner/repo-one
      test_command: uv run pytest
      auto_approve: false  # true starts chores from the API, MCP or n8n without asking; throwaway repos only
    - name: owner/repo-two
      test_command: npm ci && npm test
      # test_timeout_seconds: 900  # optional; default is REPO_TEST_TIMEOUT_SECONDS (600)
  sites:                # uptime, hourly, plain HTTP from the scheduler Job
    - https://example.com
  pages:                # Lighthouse and the broken link crawl, weekly, on the self hosted worker
    - https://example.com/

# Optional. Notes a reviewer leaves on a website, stored in that site's Cloudflare D1
# database (table review_comments), become repo chores. Needs CLOUDFLARE_D1_TOKEN in the
# scheduler's environment. Every value below is a placeholder.
# review_notes:
#   enabled: false                  # only a YAML true starts chores
#   repo: owner/repo-two            # must be listed above with a test_command
#   reviewer_name: Reviewer         # named in each pull request title and body
#   live_hosts: [www.example.com]   # a note on any other host is recorded, never run
#   preview_pattern: "https://{alias}-site.example.workers.dev"
#   account_id: "00000000000000000000000000000000"
#   database_id: "00000000-0000-0000-0000-000000000000"
#   allowed_paths: [src/pages/, src/content/, public/, src/site.config.ts]  # a / ends a folder
#   shared_paths: [src/site.config.ts]
#   sensitive_files: [src/site.config.ts]
#   daily_cap: 10                   # note chores started in any 24 hours

# The scheduler Job fires once an hour, on the hour in UTC, and nothing reads
# a cron line here (app/scheduler.py). On each tick it checks every site for
# uptime, watches every repo's CI through the GitHub Actions API, and applies
# the retention cleanup below. lighthouse, broken_links (per page) and
# dependency_audit (per repo, OSV.dev over its lock files) are each due 7 days
# after the last one. The digest is due at 07:30 in telegram.timezone, so the
# first tick after it, 08:00, creates it.
schedule:
  stale_triage: "0 5 * * 1"     # not built yet

retention:
  event_bodies_days: 30
  runs_days: 365

# Environment variables the image expects. Secrets:
#   DATABASE_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, MERCURY_BEARER_TOKEN,
#   MERCURY_GITHUB_TOKEN, CLOUDFLARE_D1_TOKEN (scheduler only), MODEL_API_KEY (Gemini), OLLAMA_API_KEY, PAGESPEED_API_KEY,
#   and ANTHROPIC_API_KEY, which no type uses.
# Plain settings: MAX_RUNS_PER_DAY (20), DAILY_TOKENS_PER_PROVIDER (500000),
#   MONTHLY_BUDGET_USD (5).
